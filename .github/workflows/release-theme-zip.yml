name: Release theme ZIP

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build installable theme ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify version headers match the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          style_version="$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -n1 | tr -d '\r')"
          readme_version="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1 | tr -d '\r')"
          echo "tag=$tag style.css=$style_version readme.txt=$readme_version"
          if [ "$tag" != "$style_version" ]; then
            echo "::error::Release tag ($tag) does not match style.css Version ($style_version)."
            echo "Git Updater reads the Version header on the primary branch, so these must agree."
            exit 1
          fi
          if [ "$tag" != "$readme_version" ]; then
            echo "::error::Release tag ($tag) does not match readme.txt Stable tag ($readme_version)."
            exit 1
          fi

      - name: Build stanza.zip
        run: git archive --format=zip --prefix=stanza/ HEAD -o stanza.zip

      - name: Verify ZIP contents
        run: |
          unzip -l stanza.zip
          unzip -l stanza.zip | grep -q 'stanza/style.css'
          unzip -l stanza.zip | grep -q 'stanza/readme.txt'
          unzip -l stanza.zip | grep -q 'stanza/theme.json'
          unzip -l stanza.zip | grep -q 'stanza/functions.php'
          unzip -l stanza.zip | grep -q 'stanza/templates/index.html'
          unzip -l stanza.zip | grep -q 'stanza/blocks/nav-drawer/block.json'
          unzip -l stanza.zip | grep -q 'stanza/assets/css/blocks/core-navigation.css'
          unzip -l stanza.zip | grep -q 'stanza/styles/dark.json'
          unzip -l stanza.zip | grep -q 'stanza/LICENSE'
          ! unzip -l stanza.zip | grep -q 'stanza/README.md'
          ! unzip -l stanza.zip | grep -q 'stanza/CSS-REPORT.md'
          ! unzip -l stanza.zip | grep -q 'stanza/DRIFT-LOG.md'
          ! unzip -l stanza.zip | grep -q 'stanza/docs/'
          ! unzip -l stanza.zip | grep -q 'stanza/.github/'
          ! unzip -l stanza.zip | grep -q 'stanza/.git'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stanza-theme
          path: stanza.zip

      - name: Attach ZIP to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: stanza.zip
